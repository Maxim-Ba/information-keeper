version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - performance
        - style
        - experimental
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - whitespace
    - revive      

formatters:
  enable:
    - gofmt
    - goimports
