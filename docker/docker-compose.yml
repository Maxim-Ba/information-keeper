version: '3.8'

services:
  postgres:
      container_name: postgres
      image: postgres:latest
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
      volumes:
        - postgres-data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      networks:
        - app-network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5

  minio:
      image: minio/minio
      container_name: minio
      ports:
        - "9000:9000"  # API порт
        - "9001:9001"  # Web интерфейс
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      volumes:
        - minio-data:/data
      command: server /data --console-address ":9001"
      networks:
        - app-network
    
  create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/your-bucket;
      /usr/bin/mc policy set public myminio/your-bucket;
      exit 0;
      "
    networks:
      - app-network



volumes:
  minio-data:
  postgres-data:

networks:
  app-network:
    driver: bridge
